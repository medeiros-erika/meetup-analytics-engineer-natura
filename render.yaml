# Blueprint do Render: cria o web service e o Postgres de uma vez.
services:
  - type: web
    name: meetup-scd2
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meetup-scd2-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false        # o Render pede o valor na criação
      - key: NODE_VERSION
        value: "22"

databases:
  - name: meetup-scd2-db
    plan: free
    region: virginia
    databaseName: meetup
    user: meetup
